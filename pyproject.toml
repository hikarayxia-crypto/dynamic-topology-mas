[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-topology-mas"
version = "0.1.0"
description = "动态拓扑下多智能体协同策略的弹性泛化仿真基础框架"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "matplotlib>=3.8",
]

[tool.setuptools]
packages = ["agents", "algorithms", "coordination", "core", "environments", "evaluation", "interaction", "training"]
